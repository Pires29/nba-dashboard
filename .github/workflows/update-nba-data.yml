name: Update NBA data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a smoke test, publish live data, or refresh the beta season replay"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - replay
  schedule:
    # Six daily refresh attempts. GitHub may start scheduled jobs a few minutes
    # late; each one must still publish rather than being discarded.
    # Times are 10:00, 15:00, 17:00, 18:00, 19:00 and 20:00 ET during EDT.
    - cron: "0 0,14,19,21-23 * * *"

permissions:
  contents: read

concurrency:
  group: update-nba-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      NBA_WRITE_LOCAL_DATA: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Smoke test NBA API
        if: inputs.mode == 'smoke'
        run: |
          python -c "from update_data import fetch_raw_player_stats; df = fetch_raw_player_stats(); print(f'NBA API smoke test passed: {len(df)} player rows')"

      - name: Publish NBA data snapshot
        if: inputs.mode == 'full'
        env:
          NBA_STORAGE_MANIFEST: current.json
        run: python update_data.py

      - name: Publish beta season replay snapshot
        if: github.event_name == 'schedule' || inputs.mode == 'replay'
        env:
          # One historic NBA day advances for each calendar day after beta launch.
          # Change only these two dates to restart or retime the replay.
          NBA_REPLAY_START_DATE: "2026-03-11"
          NBA_REPLAY_LAUNCH_DATE: "2026-09-15"
          NBA_STATS_SEASON: "2025-26"
          NBA_PREV_SEASON: "2024-25"
          NBA_ROSTER_SEASON: "2025-26"
          NBA_STORAGE_MANIFEST: qa-current.json
          NBA_REPLAY_SOURCE_MANIFEST: qa-replay-source.json
          NBA_STORAGE_VERSION: beta-replay-${{ github.run_id }}-${{ github.run_attempt }}
        run: python update_data.py
