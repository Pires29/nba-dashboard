name: Update NBA data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a smoke test, publish live data, or refresh the beta season replay"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - replay
  schedule:
    # GitHub schedules use UTC. The job below gates execution by
    # America/New_York time so daylight saving changes do not shift updates.
    - cron: "0 0-1,14-23 * * *"

permissions:
  contents: read

concurrency:
  group: update-nba-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      NBA_WRITE_LOCAL_DATA: "false"

    steps:
      - name: Check update window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_hour="$(TZ=America/New_York date +%H)"
          case "$ny_hour" in
            10|15|17|18|19|20)
              echo "run_update=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_update=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: current America/New_York hour is $ny_hour."
              ;;
          esac

      - name: Checkout
        if: steps.window.outputs.run_update == 'true'
        uses: actions/checkout@v5

      - name: Setup Python
        if: steps.window.outputs.run_update == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: steps.window.outputs.run_update == 'true'
        run: pip install -r requirements.txt

      - name: Smoke test NBA API
        if: steps.window.outputs.run_update == 'true' && inputs.mode == 'smoke'
        run: |
          python -c "from update_data import fetch_raw_player_stats; df = fetch_raw_player_stats(); print(f'NBA API smoke test passed: {len(df)} player rows')"

      - name: Publish NBA data snapshot
        if: steps.window.outputs.run_update == 'true' && inputs.mode == 'full'
        env:
          NBA_STORAGE_MANIFEST: current.json
        run: python update_data.py

      - name: Publish beta season replay snapshot
        if: steps.window.outputs.run_update == 'true' && (github.event_name == 'schedule' || inputs.mode == 'replay')
        env:
          # One historic NBA day advances for each calendar day after beta launch.
          # Change only these two dates to restart or retime the replay.
          NBA_REPLAY_START_DATE: "2026-03-11"
          NBA_REPLAY_LAUNCH_DATE: "2026-09-15"
          NBA_STATS_SEASON: "2025-26"
          NBA_PREV_SEASON: "2024-25"
          NBA_ROSTER_SEASON: "2025-26"
          NBA_STORAGE_MANIFEST: qa-current.json
          NBA_REPLAY_SOURCE_MANIFEST: qa-replay-source.json
          NBA_STORAGE_VERSION: beta-replay-${{ github.run_id }}-${{ github.run_attempt }}
        run: python update_data.py
