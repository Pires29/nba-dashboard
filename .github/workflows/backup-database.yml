name: Backup database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Dump production database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL secret is required."
            exit 1
          fi

          mkdir -p backups
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump "$BACKUP_DATABASE_URL" --format=custom --no-owner --no-acl --file="backups/nba-dashboard-${timestamp}.dump"
          gzip "backups/nba-dashboard-${timestamp}.dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.dump.gz
          retention-days: 14
