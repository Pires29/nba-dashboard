name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nba_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nba_dashboard_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nba_dashboard_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      STRIPE_PRICE_MONTHLY: price_ci_monthly
      STRIPE_PRICE_SEASON: price_ci_season
      STRIPE_REFERRAL_COUPON_ID: coupon_ci_referral
      CLEANUP_SECRET: ci-only-cleanup-secret-with-at-least-32-characters
      NBA_DATA_SOURCE: local
      QA_MODE: "false"
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to an empty database
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Integration smoke tests
        run: npm run test:integration
